<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="45%" stop-color="#FFE4E9"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5D8F"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E07A8B" flood-opacity="0.22"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="690" y="22" width="276" height="256" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- 배경 카드 -->
  <rect width="1000" height="300" rx="32" fill="url(#bgGrad)"/>

  <!-- 장식 배경 원 -->
  <circle cx="850" cy="40" r="180" fill="#FFCCD5" opacity="0.35"/>
  <circle cx="90" cy="230" r="110" fill="#FFF5F7" opacity="0.6"/>

  <!-- 좌측 텍스트 콘텐츠 -->
  <g transform="translate(56, 42)">
    <!-- 뱃지 -->
    <rect x="0" y="0" width="186" height="34" rx="17" fill="#FF477E"/>
    <text x="93" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
      PEPERO SPECIAL 🌸
    </text>

    <!-- 메인 타이틀 -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#1E293B" letter-spacing="-0.6">
      <tspan fill="#FF477E">빼빼로데이</tspan>에는 진심을 선물하세요 🌸
    </text>

    <!-- 서브 카피 -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="17" font-weight="600" fill="#64748B" letter-spacing="-0.3">
      학교 쪽문 주황색 부스(STARTUP) · 하냥냥 단독 할인
    </text>

    <!-- 상세보기 버튼 모티브 -->
    <g transform="translate(0, 150)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="158" height="42" rx="21" fill="url(#btnGrad)"/>
      <text x="79" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        소개글 보러가기 ➔
      </text>
    </g>
  </g>

  <!-- 우측 실물 사진 썸네일 카드 (4번 사진 - 핑크 & 레드) -->
  <g filter="url(#cardShadow)">
    <rect x="684" y="16" width="288" height="268" rx="32" fill="#FFFFFF"/>
    <image href="/assets/promo/hero-together.jpg" x="690" y="22" width="276" height="256" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
    <!-- 사진 위 뱃지 -->
    <rect x="706" y="38" width="92" height="26" rx="13" fill="rgba(255, 255, 255, 0.94)"/>
    <text x="752" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#FF477E" text-anchor="middle">
      핑크 &amp; 레드 세트
    </text>
  </g>
</svg>
